# Example: adding frigate_bot to an existing Frigate docker-compose.
#
# The bot reaches the `frigate` and `mosquitto` services by these names
# (frigate:5000 and mosquitto:1883), so they must be in the same compose file.

services:

  frigate_bot:
    container_name: frigate_bot
    build:
      context: ./frigate_bot
    restart: unless-stopped

    # Uncomment if you have an Intel iGPU — hardware video encoding (VAAPI):
    # environment:
    #   LIBVA_DRIVER_NAME: iHD
    # devices:
    #   - /dev/dri:/dev/dri

    volumes:
      - ./frigate_bot:/app
      - /etc/localtime:/etc/localtime:ro   # host time zone for captions

    depends_on:
      - frigate
      - mosquitto
